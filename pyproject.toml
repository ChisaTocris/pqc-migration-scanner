[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pqc-migration-scanner"
version = "0.1.0"
description = "CLI tool for scanning codebases for post-quantum cryptography vulnerabilities"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "PQC Scanner Team", email = "security@pqc-scanner.dev"}
]
keywords = ["security", "cryptography", "post-quantum", "compliance", "scanning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "gitpython>=3.1.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
pqc-scan = "pqc_scanner.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/pqc-migration-scanner"
Documentation = "https://github.com/yourusername/pqc-migration-scanner#readme"
Repository = "https://github.com/yourusername/pqc-migration-scanner"
Issues = "https://github.com/yourusername/pqc-migration-scanner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pqc_scanner"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=pqc_scanner --cov-report=html --cov-report=term-missing"
